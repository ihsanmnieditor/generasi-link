<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>GENERASI — Pendaftaran</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #0f172a; color: #f1f5f9; text-align: center; padding: 24px; box-sizing: border-box; }
  main { max-width: 420px; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  p { margin: 8px 0; line-height: 1.5; color: #cbd5e1; }
  a.btn { display: inline-block; margin-top: 16px; padding: 14px 24px; border-radius: 10px;
          background: #22c55e; color: #052e16; font-weight: 700; text-decoration: none; font-size: 1.05rem; }
</style>
</head>
<body>
<main>
  <h1>Anda sedang dibawa ke laman pendaftaran GENERASI…</h1>
  <p>Jika laman tidak terbuka secara automatik, tekan butang di bawah.</p>

  <!-- ============================================================
       SATU-SATUNYA TEMPAT UNTUK TUKAR DESTINASI:
       ubah nilai href pada pautan id="dest" di bawah sahaja.
       Redirect automatik dan pautan alternatif kedua-duanya
       menggunakan nilai ini.
       ============================================================ -->
  <a id="dest" class="btn" href="https://ihsanmnieditor.github.io/daftar/">Buka laman pendaftaran</a>
</main>

<script>
  // Membaca destinasi daripada pautan #dest (tiada salinan kedua).
  (function () {
    var link = document.getElementById("dest");
    if (link && link.href) { window.location.replace(link.href); }
  })();
</script>
</body>
</html>
